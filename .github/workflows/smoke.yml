name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build Gox runtime
        run: |
          git clone --depth 1 https://github.com/14752222/Gox.git _gox
          go build -o ../gox.exe ./cmd/gox
      - name: Run smoke tests
        shell: bash
        run: |
          if ./gox.exe test/smoke.js; then
            echo "smoke passed"
          else
            echo "::error::gox-ui smoke test failed"
            exit 1
          fi
